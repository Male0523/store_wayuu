{% extends "admin/change_form.html" %}
{% load i18n admin_urls %}
{% block breadcrumbs %}<div class="breadcrumbs admin-context-trail"><a href="{% url 'admin:index' %}">Inicio</a><a href="{% url 'admin:app_list' app_label=opts.app_label %}">{{ opts.app_config.verbose_name }}</a><a href="{% url opts|admin_urlname:'changelist' %}">{{ opts.verbose_name_plural|capfirst }}</a>{% if original %}<span>{{ original }}</span>{% else %}<span>Nuevo {{ opts.verbose_name }}</span>{% endif %}</div>{% endblock %}
