{% extends 'store/base.html' %}
{% block title %}Ingresar | Mantas Wayuu{% endblock %}
{% block content %}<section class="auth"><p class="eyebrow">Tu cuenta</p><h1>Inicia sesión</h1><form method="post">{% csrf_token %}<label>Usuario<input name="username" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Ingresar</button></form><p>¿Aún no tienes cuenta? <a href="{% url 'store:register_customer' %}">Regístrate como cliente</a>.</p><p>¿Eres artesana Wayuu? <a href="{% url 'store:register_craftswoman' %}">Solicita tu cuenta de tejedora</a>.</p></section>{% endblock %}
