services:
  # API Django: conserva la lógica existente y usa PostgreSQL administrado.
  - type: web
    name: wayuuwaa-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput"
    # En el plan gratuito no hay preDeployCommand. migrate es idempotente y
    # se ejecuta antes de iniciar Gunicorn para preparar la base recién creada.
    startCommand: "cd backend && python manage.py migrate --noinput && gunicorn config.wsgi --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ENV
        value: production
      - key: ALLOWED_HOSTS
        value: "wayuuwaa-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://wayuuwaa-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://wayuuwaa-frontend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: wayuuwaa-db
          property: connectionString

  # Frontend React + Vite publicado como sitio estático gratuito.
  - type: web
    name: wayuuwaa-frontend
    runtime: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://wayuuwaa-backend.onrender.com/api/v1"

databases:
  - name: wayuuwaa-db
    databaseName: wayuuwaa
    user: wayuuwaa
    plan: free
    region: oregon
